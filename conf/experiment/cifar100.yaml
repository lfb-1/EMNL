experiment:
  name: cifar100
  trainer: cifar
  dataset: cifar100
  backbone: resnet34
  r: 0.5
  noise_mode: instance
  root_dir: ${root}
  warmup_epochs: 10
  total_epochs: 150
  lr: 0.02
  wd: 0.0005
  nesterov: false
  batch_size: 128
  num_workers: 5
  num_classes: 100
  wandb: true
  beta: 0.9
  lr_decay: [100]
  num_prior: 2
  optim_goal: ${optim_goal}
  memory_queue_len: 3
  loss_weight: ${loss_weight}
